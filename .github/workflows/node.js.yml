name: Deploy sagargroup backend

on:
  push:
    branches: [master]
  workflow_dispatch:


concurrency:
  group: sagargroup-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ]; then
            install -m 600 /home/ubuntu/secrets/sagargroup/.env .env
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"

      - name: Install and validate backend
        run: |
          npm ci
          npm run build --if-present
          node --check server.js
          node --check ecosystem.config.js
          bash -n .github/scripts/deploy-pm2.sh

      - name: Apply PM2 configuration
        run: bash .github/scripts/deploy-pm2.sh
